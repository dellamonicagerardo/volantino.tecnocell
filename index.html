<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volantino Tecnocell</title>
    <meta name="description" content="Sfoglia il volantino offerte di Tecnocell.">
    <meta name="theme-color" content="#278036">
    <link rel="icon" href="assets/tecnocell-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="topbar__brand" id="shop-link" href="https://tecnocell.shop" target="_blank" rel="noopener">
        <img src="assets/tecnocell-logo.png" alt="Tecnocell">
      </a>
      <p class="topbar__title" id="flyer-title">Volantino</p>
      <a class="topbar__shop" id="shop-button" href="https://tecnocell.shop" target="_blank" rel="noopener">Visita il sito</a>
    </header>

    <main class="app">
      <button class="nav nav--prev" id="prev" type="button" aria-label="Pagina precedente" disabled>
        <span aria-hidden="true">‹</span>
      </button>
      <div class="stage">
        <div class="sizer" id="sizer">
          <div id="book" aria-label="Volantino Tecnocell"></div>
        </div>
        <p class="status" id="status">Apro il volantino…</p>
      </div>
      <button class="nav nav--next" id="next" type="button" aria-label="Pagina successiva" disabled>
        <span aria-hidden="true">›</span>
      </button>
    </main>

    <footer class="pager">
      <p id="pager-label" aria-live="polite">Copertina</p>
      <p class="pager__hint">Trascina l’angolo per sfogliare</p>
    </footer>

</html>
